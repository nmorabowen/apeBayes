[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apeBayes"
version = "0.2.0"
description = "Bayesian hierarchical quantification of epistemic uncertainty in computational mechanics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nicolás Mora-Bowen", email = "nmorabowen@gmail.com"},
]
keywords = [
    "bayesian",
    "epistemic-uncertainty",
    "seismic",
    "finite-element",
    "hierarchical-model",
    "fragility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pymc>=5.10",
    "arviz>=0.17",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
fast = ["nutpie>=0.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apeBayes"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
